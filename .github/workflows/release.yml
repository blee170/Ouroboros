name: release
# Builds and publishes a Windows release whenever the version in package.json changes
# (or on a v* tag / manual run). The workflow creates the vX.Y.Z tag itself if missing,
# so no local tag push is required.
on:
  push:
    tags: ['v*']
    branches: ['**']
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve version and tag
        id: ver
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null 2>&1 && [[ "$GITHUB_REF" != "refs/tags/v$VERSION" ]]; then
            if gh release view "v$VERSION" >/dev/null 2>&1; then
              echo "release v$VERSION already exists; nothing to do"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create tag if missing
        if: steps.ver.outputs.skip != 'true' && !startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          V="v${{ steps.ver.outputs.version }}"
          if ! git ls-remote --exit-code --tags origin "$V" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$V" -m "Ouroboros ${{ steps.ver.outputs.version }}"
            git push origin "$V"
          fi
      - if: steps.ver.outputs.skip != 'true'
        run: npm ci
      - if: steps.ver.outputs.skip != 'true'
        run: npm run typecheck
      - if: steps.ver.outputs.skip != 'true'
        run: npm test
      - if: steps.ver.outputs.skip != 'true'
        run: node scripts/gen-icon.mjs && npm run build
      - name: Package and publish to GitHub Releases
        if: steps.ver.outputs.skip != 'true'
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
